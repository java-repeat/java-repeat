# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0    # Earlier tags and history for the release notes
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Build with Maven
        run: ./mvnw clean verify

      - name: Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Check Sonar Status
        # Pinned to the v1 tag rather than a commit SHA on purpose, so v1 updates are picked up
        uses: sonarcloud-actions/sonarcloud-check-status-action@v1 # NOSONAR
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        # Tracks the Snyk master branch rather than a commit SHA on purpose, so Snyk updates are picked up
        uses: snyk/actions/maven-3-jdk-17@master # NOSONAR
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          # setup-java exports the runner JDK path, which does not exist inside the Snyk container
          JAVA_HOME: /opt/java/openjdk

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Release to Maven Central
        run: |
          git config --global user.email "java-repeat@github.com"
          git config --global user.name "java-repeat"
          ./mvnw --batch-mode clean release:prepare release:perform

        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      # release:prepare tagged the previous commit; HEAD is the next snapshot.
      - name: Find the released version
        id: released
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#repeat-}" >> "$GITHUB_OUTPUT"
          echo "previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # Needs an ANTHROPIC_API_KEY secret. If this step fails, the release
      # below falls back to GitHub's generated notes.
      - name: Write release notes with Claude
        id: notes
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Write the GitHub release notes for java-repeat ${{ steps.released.outputs.version }}.
            The release is tag ${{ steps.released.outputs.tag }}; the previous release is tag ${{ steps.released.outputs.previous }}.
            Read the changes with `git log --no-merges ${{ steps.released.outputs.previous }}..${{ steps.released.outputs.tag }}`
            and `git diff ${{ steps.released.outputs.previous }} ${{ steps.released.outputs.tag }} -- src/main pom.xml`.
            Ignore the maven-release-plugin bookkeeping commits.

            java-repeat is a small Java library: Kotlin-style repeat(n, i -> ...) with support for checked exceptions.
            Readers are Java developers deciding whether and how to upgrade.

            Style:
            - Plain, short, declarative sentences. No emoji, no exclamation marks, no marketing adjectives.
            - The name is always lowercase and hyphenated: java-repeat.
            - Put identifiers, types and versions in `code`.
            - Describe what changed for users of the library. Skip CI, build tooling, code style and test-only
              changes unless they change what users get (for example the minimum Java version).

            Return the notes as Markdown in the `notes` field, starting directly with the content (no title or version heading):
            1. One or two sentences summarizing the release.
            2. "## Breaking changes", only if there are any: each change and how to update code, with a short
               before/after code block when a call site changes.
            3. "## Changes" for new features, fixes and behavior changes, only if there are any.
            Leave out install instructions and a changelog link; they are added afterwards.
            Only state what the commits and diff support.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 10
            --allowedTools "Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read"
            --json-schema '{"type":"object","properties":{"notes":{"type":"string"}},"required":["notes"]}'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.released.outputs.tag }}
          VERSION: ${{ steps.released.outputs.version }}
          PREVIOUS: ${{ steps.released.outputs.previous }}
          STRUCTURED_OUTPUT: ${{ steps.notes.outputs.structured_output }}
        run: |
          install=$(printf '%s\n' \
            '## Install' \
            '' \
            '```xml' \
            '<dependency>' \
            '  <groupId>io.github.java-repeat</groupId>' \
            '  <artifactId>repeat</artifactId>' \
            "  <version>$VERSION</version>" \
            '</dependency>' \
            '```' \
            '' \
            '```kotlin' \
            "implementation(\"io.github.java-repeat:repeat:$VERSION\")" \
            '```')
          notes=""
          [ -n "$STRUCTURED_OUTPUT" ] && notes=$(jq -r '.notes // empty' <<<"$STRUCTURED_OUTPUT" 2>/dev/null || true)
          if [ -n "$notes" ]; then
            changelog=""
            [ -n "$PREVIOUS" ] && changelog="**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/$PREVIOUS...$TAG"
            printf '%s\n\n%s\n\n%s\n' "$notes" "$install" "$changelog" > notes.md
            gh release create "$TAG" --title "$VERSION" --verify-tag --latest --notes-file notes.md
          else
            echo "::warning::Claude did not write release notes; using GitHub's generated notes"
            gh release create "$TAG" --title "$VERSION" --verify-tag --latest --generate-notes --notes "$install"
          fi
