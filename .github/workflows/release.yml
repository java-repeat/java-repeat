# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.released.outputs.tag }}
      version: ${{ steps.released.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Build with Maven
        run: ./mvnw clean verify

      - name: Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Check Sonar Status
        # Pinned to the v1 tag rather than a commit SHA on purpose, so v1 updates are picked up
        uses: sonarcloud-actions/sonarcloud-check-status-action@v1 # NOSONAR
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        # Tracks the Snyk master branch rather than a commit SHA on purpose, so Snyk updates are picked up
        uses: snyk/actions/maven-3-jdk-17@master # NOSONAR
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          # setup-java exports the runner JDK path, which does not exist inside the Snyk container
          JAVA_HOME: /opt/java/openjdk

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Release to Maven Central
        run: |
          git config --global user.email "java-repeat@github.com"
          git config --global user.name "java-repeat"
          ./mvnw --batch-mode clean release:prepare release:perform

        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      # release:prepare tagged the previous commit; HEAD is the next snapshot.
      - name: Find the released version
        id: released
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#repeat-}" >> "$GITHUB_OUTPUT"

  # Claude writes the release notes and publishes the GitHub release.
  release-notes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # Earlier tags and history for the notes
          persist-credentials: false

      - name: Find the previous release
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        # A Claude outage must never lose the release; the next step covers it.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /release-notes ${{ env.TAG }} ${{ steps.previous.outputs.tag }}

            You are running unattended in CI after java-repeat ${{ env.VERSION }} was published to Maven Central. Nobody can answer questions.

            After the skill has written release-notes.md, publish it with exactly:
            `gh release create ${{ env.TAG }} --title ${{ env.VERSION }} --verify-tag --latest --notes-file release-notes.md`
          claude_args: >-
            --max-turns 15
            --allowedTools "Skill,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git describe:*),Bash(gh release create:*),Read,Write"

      # Runs only if Claude did not publish the release.
      - name: Fall back to generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists."
            exit 0
          fi
          echo "::warning::Claude did not publish $TAG; creating it with GitHub's generated notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --verify-tag --latest --generate-notes
